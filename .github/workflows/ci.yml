name: Continuous Integration

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'Cloud Projects/package.json'

      - name: Install dependencies
        working-directory: './Cloud Projects'
        run: npm ci

      - name: Verify code formatting (Prettier)
        working-directory: './Cloud Projects'
        run: npm run format:check

      - name: Lint code (ESLint)
        working-directory: './Cloud Projects'
        run: npm run lint

      - name: Run unit tests (Vitest)
        working-directory: './Cloud Projects'
        run: npm run test

      - name: Compile and build production bundle
        working-directory: './Cloud Projects'
        run: npm run build
